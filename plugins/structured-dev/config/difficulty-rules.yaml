# 难度评分规则
# 用于 analyze-and-split-requirements 和 structured-requirement-confirmation

scoring:
  # 5 维度评分标准
  file_count:
    "1-2": 1
    "3-5": 3
    "6+": 5

  dependency_complexity:
    independent: 1
    "2-3 modules": 3
    "4+ modules": 5

  requirement_clarity:
    "very clear": 1
    "2-3 unclear": 3
    "4+ unclear": 5

  technical_risk:
    conventional: 1
    "new tech/refactor": 3
    "architecture change": 5

  business_complexity:
    "simple CRUD": 1
    "business rules": 3
    "core workflow": 5

# 难度等级定义
difficulty_levels:
  low:
    max_score: 10
    test_requirement: "TDD + 功能验证"
    archive_days: 7
    needs_requirement_doc: false
    needs_unit_test: false

  medium:
    min_score: 11
    max_score: 15
    test_requirement: "TDD + 集成测试"
    archive_days: 14
    needs_requirement_doc: true
    needs_unit_test: false

  high:
    min_score: 16
    test_requirement: "必须单元测试 + TDD + 集成测试"
    archive_days: 30
    needs_requirement_doc: true
    needs_unit_test: true
    coverage_target: 80

# 额外加分项
bonus_points:
  multi_version_merge: 2        # 涉及多个版本/分支合并
  preserve_existing: 1          # 需要保留现有功能
  new_architecture: 3           # 需要引入新架构
  compatibility_test: 2         # 需要兼容性测试
  has_migration_doc: -1         # 有详细迁移计划文档（降低难度）
  has_prd_doc: -1               # 有 PRD 文档
