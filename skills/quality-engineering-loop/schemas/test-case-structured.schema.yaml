# 结构化测试用例

## 顶层结构

|字段|类型|必填|约束|说明|
|---|---|---|---|---|
|id|string|是||用例ID，如 TC001|
|name|string|是||用例名称|
|given|string|是||前置条件（Given）|
|when|string|是||操作步骤（When）|
|then|string|是||预期结果（Then）|
|priority|string|是|enum: P0, P1, P2|优先级|
|mappedRules|array[string]|否||映射到的 PRD 规则ID列表|
|category|string|否|enum: normal, boundary, exception, concurrency|测试类别|
|source|string|否||来源文件路径|
